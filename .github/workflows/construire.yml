# Construit l'application autonome Windows et la publie dans les « Releases » du dépôt.
# Déclenchement : pousser une étiquette de version (git tag v2.6.0 ; git push origin v2.6.0),
# ou à la main depuis l'onglet Actions (« Run workflow »).
name: Construire l'exécutable Windows

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          python -m pytest -q tests
      - name: Construction (avec les modèles à licence libre)
        shell: pwsh
        run: .\tools\construire.ps1 -TelechargerModeles -Python python
      - name: Essai de démarrage de l'exécutable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ChasseurDoublons\ChasseurDoublons.exe -ArgumentList "--no-browser","--port","8799","--sans-modeles" -PassThru
          Start-Sleep -Seconds 20
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/api/caps
          Stop-Process -Id $p.Id -Force
          if ($r.StatusCode -ne 200) { throw "l'exécutable ne répond pas" }
          $r.Content
      - uses: actions/upload-artifact@v4
        with:
          name: ChasseurDoublons-win64
          path: dist/ChasseurDoublons-v*-win64.zip
          compression-level: 0
      - name: Publication dans Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ChasseurDoublons-v*-win64.zip
          generate_release_notes: true
